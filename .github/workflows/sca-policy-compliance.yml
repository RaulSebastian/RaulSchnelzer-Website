name: SCA Policy Compliance

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  security-events: read

jobs:
  detect-dependency-files:
    name: Detect Dependency Files
    runs-on: ubuntu-latest
    outputs:
      has_dependency_files: ${{ steps.detect.outputs.has_dependency_files }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect supported dependency manifests
        id: detect
        shell: bash
        run: |
          if find . \
            \( -name package-lock.json -o -name npm-shrinkwrap.json -o -name yarn.lock -o -name pnpm-lock.yaml \
            -o -name pom.xml -o -name build.gradle -o -name build.gradle.kts -o -name Pipfile.lock \
            -o -name poetry.lock -o -name requirements.txt -o -name go.sum -o -name Cargo.lock \
            -o -name composer.lock -o -name Gemfile.lock \) \
            -not -path './node_modules/*' -print -quit | grep -q .; then
            echo "has_dependency_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dependency_files=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: SCA Dependency Review
    if: github.event_name == 'pull_request' && needs.detect-dependency-files.outputs.has_dependency_files == 'true'
    needs: detect-dependency-files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  release-readiness:
    name: SCA Release Readiness
    needs: detect-dependency-files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate SCA policy compliance
        env:
          GITHUB_TOKEN: ${{ secrets.SCA_ALERTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/check_sca_compliance.py
